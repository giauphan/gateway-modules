[package]
name = "proxy-guard"
version = "1.0.0"
edition = "2021"
description = "Native Rust proxy traffic optimizer & bandwidth saver for Toolcase Gateway"
license = "MIT"

[[bin]]
name = "proxy-guard"
path = "src/main.rs"

[lib]
name = "proxy_guard"
path = "src/lib.rs"

[features]
default = []
test-helpers = []

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
