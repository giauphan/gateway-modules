[package]
name = "daily-news"
version = "1.10.0"
edition = "2021"
description = "Native Rust engine and stdio-stream adapter for Daily News & Content Discovery Service"
license = "MIT"

[[bin]]
name = "daily-news"
path = "src/main.rs"

[lib]
name = "daily_news"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.2", features = ["json", "platform-verifier"] }
sha2 = "0.11"
uuid = { version = "1.20", features = ["v4"] }
