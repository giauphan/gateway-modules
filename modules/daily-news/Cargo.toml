[package]
name = "daily-news"
version = "1.19.24"
edition = "2021"
description = "Native Rust engine and stdio-stream adapter for Daily News & Content Discovery Service"
license = "MIT"

[[bin]]
name = "daily-news"
path = "src/main.rs"

[lib]
name = "daily_news"
path = "src/lib.rs"

[features]
default = []
test-helpers = []

# Shipped binary is the precompiled ./daily-news executed by run.sh: favour size.
# Tests run on the dev profile, so panic = "abort" does not affect `cargo test`.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dev-dependencies]
daily-news = { path = ".", features = ["test-helpers"] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.2", features = ["json", "platform-verifier"] }
sha2 = "0.11"
uuid = { version = "1.20", features = ["v4"] }
crc32fast = "1.5"
miniz_oxide = "0.9"
libc = "0.2"
rusqlite = { version = "0.30", features = ["bundled"] }
ring = "0.17"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
