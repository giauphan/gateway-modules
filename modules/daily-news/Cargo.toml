[package]
name = "daily-news"
version = "1.19.8"
edition = "2021"
description = "Native Rust engine and stdio-stream adapter for Daily News & Content Discovery Service"
license = "MIT"

[[bin]]
name = "daily-news"
path = "src/main.rs"

[lib]
name = "daily_news"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.2", features = ["json", "platform-verifier"] }
sha2 = "0.11"
uuid = { version = "1.20", features = ["v4"] }
crc32fast = "1.5"
miniz_oxide = "0.9"
libc = "0.2"
rusqlite = { version = "0.30", features = ["bundled"] }
ring = "0.17"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
